<svg width="100%" viewBox="0 0 680 740" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Munich RAG Compliance — System Architecture</title>
<desc>End-to-end pipeline: user query enters a LangGraph agent, is classified and routed to single or parallel hybrid retrieval against a Qdrant vector store, context is assembled from parent chunks, Mistral generates a citation-grounded answer, and a ComplianceResponse is returned. Langfuse traces all LLM calls. Deployed on AWS EKS.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #111827; }
    .th  { font-size: 14px; font-weight: 600; }
    .ts  { font-size: 12px; fill: #6b7280; }
    .arr { stroke: #9ca3af; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .node-teal   { fill: #e1f5ee; stroke: #0f6e56; }
    .node-purple { fill: #eeedfe; stroke: #534ab7; }
    .node-gray   { fill: #f1efe8; stroke: #5f5e5a; }
    .node-coral  { fill: #faece7; stroke: #993c1d; }
    .node-amber  { fill: #faeeda; stroke: #854f0b; }
    .label-teal   { fill: #085041; }
    .label-purple { fill: #3c3489; }
    .label-gray   { fill: #444441; }
    .label-coral  { fill: #712b13; }
    .label-amber  { fill: #633806; }
    .sub-teal     { fill: #0f6e56; }
    .sub-purple   { fill: #534ab7; }
    .sub-gray     { fill: #5f5e5a; }
    .sub-coral    { fill: #993c1d; }
    .sub-amber    { fill: #854f0b; }
    .container    { fill: none; stroke: #7f77dd; stroke-width: 0.5; stroke-dasharray: 6 4; opacity: 0.5; }
    .footer       { fill: none; stroke: #888780; stroke-width: 0.5; stroke-dasharray: 4 3; opacity: 0.4; }
    .dashed-arr   { stroke: #9ca3af; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; marker-end: url(#arrow); }
    .muted        { fill: #9ca3af; }
  </style>
</defs>

<!-- USER QUERY -->
<rect x="240" y="24" width="200" height="44" rx="8" stroke-width="0.5" class="node-teal"/>
<text class="th label-teal" x="340" y="46" text-anchor="middle" dominant-baseline="central">User query</text>

<line x1="340" y1="68" x2="340" y2="96" class="arr"/>

<!-- LANGGRAPH AGENT container -->
<rect x="36" y="96" width="608" height="296" rx="14" class="container"/>
<text class="ts muted" x="56" y="116">LangGraph agent</text>

<!-- CLASSIFIER -->
<rect x="220" y="124" width="240" height="52" rx="8" stroke-width="0.5" class="node-purple"/>
<text class="th label-purple" x="340" y="144" text-anchor="middle" dominant-baseline="central">Classifier</text>
<text class="ts sub-purple" x="340" y="162" text-anchor="middle" dominant-baseline="central">Mistral — query intent detection</text>

<!-- three routing arrows -->
<line x1="260" y1="176" x2="120" y2="220" class="arr"/>
<line x1="340" y1="176" x2="340" y2="220" class="arr"/>
<line x1="420" y1="176" x2="560" y2="220" class="arr"/>

<!-- route labels -->
<text class="ts muted" x="174" y="204" text-anchor="middle">multi_article</text>
<text class="ts muted" x="340" y="213" text-anchor="middle">simple_rag</text>
<text class="ts muted" x="508" y="204" text-anchor="middle">out_of_scope</text>

<!-- PARALLEL RETRIEVER -->
<rect x="48" y="220" width="160" height="52" rx="8" stroke-width="0.5" class="node-purple"/>
<text class="th label-purple" x="128" y="240" text-anchor="middle" dominant-baseline="central">Parallel retriever</text>
<text class="ts sub-purple" x="128" y="258" text-anchor="middle" dominant-baseline="central">ThreadPoolExecutor</text>

<!-- SINGLE RETRIEVER -->
<rect x="260" y="220" width="160" height="52" rx="8" stroke-width="0.5" class="node-purple"/>
<text class="th label-purple" x="340" y="240" text-anchor="middle" dominant-baseline="central">Retriever</text>
<text class="ts sub-purple" x="340" y="258" text-anchor="middle" dominant-baseline="central">Hybrid + rerank</text>

<!-- SHORT CIRCUIT -->
<rect x="472" y="220" width="156" height="52" rx="8" stroke-width="0.5" class="node-gray"/>
<text class="th label-gray" x="550" y="240" text-anchor="middle" dominant-baseline="central">Short-circuit</text>
<text class="ts sub-gray" x="550" y="258" text-anchor="middle" dominant-baseline="central">No LLM cost</text>

<!-- merge to context assembler -->
<line x1="128" y1="272" x2="270" y2="308" class="arr"/>
<line x1="340" y1="272" x2="340" y2="308" class="arr"/>

<!-- CONTEXT ASSEMBLER -->
<rect x="220" y="308" width="240" height="52" rx="8" stroke-width="0.5" class="node-purple"/>
<text class="th label-purple" x="340" y="328" text-anchor="middle" dominant-baseline="central">Context assembler</text>
<text class="ts sub-purple" x="340" y="346" text-anchor="middle" dominant-baseline="central">Parent promotion · dedup</text>

<line x1="340" y1="360" x2="340" y2="384" class="arr"/>

<!-- GENERATOR -->
<rect x="220" y="384" width="240" height="52" rx="8" stroke-width="0.5" class="node-purple"/>
<text class="th label-purple" x="340" y="404" text-anchor="middle" dominant-baseline="central">Generator</text>
<text class="ts sub-purple" x="340" y="422" text-anchor="middle" dominant-baseline="central">Mistral Large · streaming</text>

<line x1="340" y1="436" x2="340" y2="460" class="arr"/>

<!-- CITATION VALIDATOR -->
<rect x="220" y="460" width="240" height="52" rx="8" stroke-width="0.5" class="node-teal"/>
<text class="th label-teal" x="340" y="480" text-anchor="middle" dominant-baseline="central">Citation validator</text>
<text class="ts sub-teal" x="340" y="498" text-anchor="middle" dominant-baseline="central">Hallucination guard</text>

<line x1="340" y1="512" x2="340" y2="536" class="arr"/>

<!-- COMPLIANCE RESPONSE -->
<rect x="180" y="536" width="320" height="56" rx="8" stroke-width="0.5" class="node-teal"/>
<text class="th label-teal" x="340" y="557" text-anchor="middle" dominant-baseline="central">ComplianceResponse</text>
<text class="ts sub-teal" x="340" y="575" text-anchor="middle" dominant-baseline="central">answer · citations · confidence score</text>

<!-- QDRANT right panel -->
<rect x="490" y="308" width="148" height="72" rx="8" stroke-width="0.5" class="node-coral"/>
<text class="th label-coral" x="564" y="330" text-anchor="middle" dominant-baseline="central">Qdrant 🇩🇪</text>
<text class="ts sub-coral" x="564" y="348" text-anchor="middle" dominant-baseline="central">Dense + BM25 sparse</text>
<text class="ts sub-coral" x="564" y="364" text-anchor="middle" dominant-baseline="central">642 chunks · hybrid</text>
<line x1="490" y1="344" x2="462" y2="344" class="arr"/>

<!-- LANGFUSE right panel -->
<rect x="490" y="400" width="148" height="52" rx="8" stroke-width="0.5" class="node-coral"/>
<text class="th label-coral" x="564" y="420" text-anchor="middle" dominant-baseline="central">Langfuse 🇩🇪</text>
<text class="ts sub-coral" x="564" y="438" text-anchor="middle" dominant-baseline="central">LLM tracing · audit</text>
<line x1="490" y1="426" x2="462" y2="415" class="dashed-arr"/>

<!-- CORPUS left panel -->
<rect x="36" y="308" width="148" height="72" rx="8" stroke-width="0.5" class="node-amber"/>
<text class="th label-amber" x="110" y="330" text-anchor="middle" dominant-baseline="central">Corpus</text>
<text class="ts sub-amber" x="110" y="348" text-anchor="middle" dominant-baseline="central">DSGVO · BDSG</text>
<text class="ts sub-amber" x="110" y="364" text-anchor="middle" dominant-baseline="central">313 pages · 164 parents</text>
<line x1="184" y1="344" x2="258" y2="344" class="arr"/>

<!-- EKS footer -->
<rect x="36" y="624" width="608" height="48" rx="8" class="footer"/>
<text class="ts muted" x="340" y="643" text-anchor="middle">Deployed as tenant workload · AWS EKS · ArgoCD GitOps · Karpenter · Week 3</text>
<text class="ts muted" x="340" y="661" text-anchor="middle">github.com/srinivas-singireddy/mlops-platform-aws-eks</text>

</svg>
