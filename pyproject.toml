[project]
name = "munich-rag-compliance"
version = "0.1.0"
description = "RAG system for German regulatory documents (BaFin + DSGVO)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.0.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "ipykernel>=6.29.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]