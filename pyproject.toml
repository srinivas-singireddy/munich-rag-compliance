[project]
name = "munich-rag-compliance"
version = "0.1.0"
description = "RAG system for German regulatory documents (BaFin + DSGVO)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.0.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "tabulate>=0.9.0", 
    "langdetect>=1.0.9",
    "regex>=2024.5.15",
    "tiktoken>=0.7.0",
    "transformers>=4.40.0",
    "tokenizers>=0.20.0",
    "sentence-splitter>=1.4",
    "sentence-transformers>=3.0.0",
    "torch>=2.4.0",
    "qdrant-client>=1.11.0",
    "fastembed>=0.4.0",
    "onnxruntime>=1.20.0,<1.26.0",        
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "ipykernel>=6.29.0",
    "pytest>=8.0.0",
    "jupyter>=1.1.1",
]

[tool.uv]
package = false


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
