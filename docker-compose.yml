services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: munich-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      # Local dev: no API key needed. In production (Week 3 EKS) this will be
      # injected via ESO from AWS Secrets Manager.
      QDRANT__LOG_LEVEL: INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  qdrant_data:
    name: munich_rag_qdrant_data